[package]
name = "sinyal-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sinyal cekirdegi — paylasimli bellekten okur, WebSocket uzerinden feed dagitir ve emir yurutur"

[lints]
workspace = true

[[bin]]
name = "sinyald"
path = "src/main.rs"

[features]
default = ["mt5-hist"]
# Gecmis bar kanalini (MQL5 Service <-> cekirdek) derlemeye dahil eder.
#
# Kapatildiginda cekirdek TAM ISLEVSEL kalir: mumlar tick'ten uretilir ve
# `candles` cevabi `src_kind: "tick"`, `hist: "off"` der. Kacis kapisi olarak
# duruyor — `sinyal-bridge::HistSession` imzasi degisirse cekirdek yine de
# derlenir ve yalnizca src/hist_bridge.rs guncellenir.
mt5-hist = []

[dependencies]
sinyal-proto = { path = "../sinyal-proto" }
sinyal-shm = { path = "../sinyal-shm" }
sinyal-bridge = { path = "../sinyal-bridge" }

# Bagimliliklar burada SORUN DEGIL: bu ikili MT5'in surecine yuklenmiyor,
# ayri bir daemon olarak calisiyor. (Bagimliliksiz olmasi gereken tek yer
# sinyal-bridge/sinyal-shm — onlar terminalin icine giriyor.)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
